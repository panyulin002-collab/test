name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 用户页（用户名.github.io）用 /，项目页用 /仓库名/
      - name: 计算部署路径
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [[ "$repo" == *.github.io ]]; then
            echo "VITEPRESS_BASE=/" >> "$GITHUB_ENV"
            echo "VITEPRESS_SITE_URL=https://${owner}.github.io/" >> "$GITHUB_ENV"
          else
            echo "VITEPRESS_BASE=/${repo}/" >> "$GITHUB_ENV"
            echo "VITEPRESS_SITE_URL=https://${owner}.github.io/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: 构建站点
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
